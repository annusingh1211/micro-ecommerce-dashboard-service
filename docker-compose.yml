# docker-compose.yml
  services:
    dashboard:
      image: annusingh12112003/ecommerce-dashboard:1.0
      container_name: ecommerce-dashboard
      ports:
        - "80:80"
      environment:
        USER_HOST: 10.0.8.58
        PROFILE_HOST: 10.0.3.159
        PRODUCT_HOST: 10.0.13.238
        CART_HOST: localhost
        ORDER_HOST: localhost
        PAYMENT_HOST: localhost
      restart: unless-stopped